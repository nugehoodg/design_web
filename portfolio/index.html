<body>

        <div class="font-bold badge">Filter</div>
        <a href="#" data-tag="all" class="tag-link text-sm font-medium hover:text-secondary-content">All</a>
        <a href="#" data-tag="poster" class="tag-link text-sm font-medium hover:text-secondary-content">Poster</a>

    <div id="masonry" class="hidden lg:block columns-2 sm:columns-2 lg:columns-4 gap-4 p-4"></div>
    <div id="masonry-mobile" class="block lg:hidden columns-2 sm:columns-2 lg:columns-4 gap-4 p-4"></div>



    <footer class="flex justify-between p-5 border-t mt-10" hx-get="../footer.html" hx-trigger="load" hx-target="this">
    </footer>

    <!-- Scroll to Top Button -->
    <button id="scrollToTopBtn"
        class="fixed bottom-20 right-6 z-50 btn btn-circle btn-primary shadow-xl opacity-0 invisible transition-all duration-300 translate-y-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
        </svg>
    </button>

    <script>
        const masonry = document.getElementById("masonry");
        const masonryMobile = document.getElementById("masonry-mobile");

        const filterLinks = document.querySelectorAll(
            ".tag-link, #filter-mobile [data-tag]",
        );

        let allProjects = [];
        let currentTag = "all";

        /* skeleton */
        function skeletonCard(withHover = false) {
            return `
  <div class="mb-4 break-inside-avoid rounded-lg overflow-hidden shadow animate-pulse ${withHover ? "hover-3d" : ""}">
    <div class="w-full aspect-video bg-base-300"></div>
  </div>
  `;
        }

        function showSkeleton() {
            masonry.innerHTML = Array(8)
                .fill(0)
                .map(() => skeletonCard(true))
                .join("");

            masonryMobile.innerHTML = Array(6)
                .fill(0)
                .map(() => skeletonCard(false))
                .join("");
        }

        /* media */
        function renderMedia(p) {
            if (p.video) {
                return `
    <video muted loop playsinline preload="none" class="w-full">
      <source src="../${p.video}" type="video/mp4">
    </video>
    `;
            }

            return `
  <img
    src="../${p.image}"
    alt="${p.title}"
    loading="lazy"
    class="w-full"
  >
  `;
        }

        /* card */
        function projectCard(p, withHover = false) {
            return `
  <div class="mb-4 break-inside-avoid rounded-lg overflow-hidden shadow ${withHover ? "hover-3d" : ""}">

    ${renderMedia(p)}


  </div>
  `;
        }

        /* render */
        function renderProjects(projects) {
            masonry.innerHTML = projects.map((p) => projectCard(p, true)).join("");

            masonryMobile.innerHTML = projects
                .map((p) => projectCard(p, false))
                .join("");

            playVisibleVideos();
        }

        /* filter */
        function filterByTag(tag) {
            if (tag === currentTag) return;

            currentTag = tag;

            if (tag === "all") {
                renderProjects(allProjects);
                return;
            }

            renderProjects(allProjects.filter((p) => p.tags?.includes(tag)));
        }

        /* active badge */
        function setActive(link) {
            filterLinks.forEach((l) => {
                l.classList.remove("badge");
                l.classList.add("text-black");
            });

            link.classList.add("badge");
            link.classList.remove("text-black");
        }

        /* video optimization using IntersectionObserver */
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.play().catch(() => { });
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.1 });

        function playVisibleVideos() {
            document.querySelectorAll("video").forEach((video) => {
                videoObserver.observe(video);
            });
        }

        /* load json */
        async function loadProjects() {
            showSkeleton();

            try {
                const res = await fetch("../projects.json");

                allProjects = await res.json();

                renderProjects(allProjects);
            } catch (err) {
                masonry.innerHTML = `<p class="text-error">Failed to load</p>`;
            }
        }

        /* events */
        filterLinks.forEach((link) => {
            link.addEventListener("click", (e) => {
                e.preventDefault();

                setActive(link);

                filterByTag(link.dataset.tag);
            });
        });

        window.addEventListener("scroll", handleScroll, { passive: true });

        /* scroll to top logic */
        const scrollToTopBtn = document.getElementById("scrollToTopBtn");

        function handleScroll() {
            // Check if user has reached near the bottom of the page (within 500px)
            const isNearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 500;

            if (isNearBottom) {
                scrollToTopBtn.classList.remove("invisible", "opacity-0", "translate-y-4");
                scrollToTopBtn.classList.add("opacity-100", "translate-y-0");
            } else {
                scrollToTopBtn.classList.remove("opacity-100", "translate-y-0");
                scrollToTopBtn.classList.add("opacity-0", "translate-y-4");
                setTimeout(() => {
                    if (scrollToTopBtn.classList.contains("opacity-0")) {
                        scrollToTopBtn.classList.add("invisible");
                    }
                }, 300);
            }
        }

        window.addEventListener("scroll", handleScroll);

        scrollToTopBtn.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });

        /* start */
        loadProjects();
    </script>
    <script src="../src/magic-cursor.js"></script>
</body>
