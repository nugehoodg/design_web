<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <title>Anugerah | Selected Works</title>
    <meta name="description"
        content="Portfolio of Anugerah, a passionate Graphic Designer, 3D Artist, and Front-end Developer with 8 years of experience creating visually compelling projects." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anugerah.vercel.app/" />
    <meta property="og:title" content="Anugerah | Graphic Designer & Front-end Developer Portfolio" />
    <meta property="og:description"
        content="Exploring the creative works of Anugerah, featuring Graphic Design, 3D Art, and Front-end Development." />
    <meta property="og:image" content="https://anugerah.vercel.app/img/OG_banner.png" />
    <meta property="og:logo" content="https://anugerah.vercel.app/favicon-32x32.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://anugerah.vercel.app/" />
    <meta property="twitter:title" content="Anugerah | Graphic Designer & Front-end Developer Portfolio" />
    <meta property="twitter:logo" content="https://anugerah.vercel.app/favicon-32x32.png" />
    <meta property="twitter:description"
        content="Exploring the creative works of Anugerah, featuring Graphic Design, 3D Art, and Front-end Development." />
    <meta property="twitter:image" content="https://anugerah.vercel.app/img/OG_banner.png" />

    <link rel="canonical" href="https://anugerah.vercel.app/" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="../src/output.css" rel="stylesheet" />
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"
        integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../src/magic-cursor.css">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anugerah",
        "url": "https://anugerah.vercel.app",
        "jobTitle": "Graphic Designer & Front-end Developer",
        "description": "Graphic Designer, 3D Artist, and Front-end Developer with 8 years of experience.",
        "knowsAbout": [
          "Graphic Design",
          "3D Art",
          "Front-end Development",
          "Video Editing",
          "Content Writing"
        ],
        "sameAs": ["https://github.com/nugehoodg"]
      }
    </script>

    <style>
        :root {
            /* Deep eggplant-purple background */
            --bg-dark:        #0e0a1a;
            --bg-surface:     #160e2a;
            --bg-card:        #1c1233;

            --text-light:     #f5f0ff;
            --text-muted:     #9b8ec4;

            /* Warm amber-orange — sits opposite purple on the colour wheel */
            --accent-color:   #f97316;   /* orange-500  */
            --accent-hover:   #fb923c;   /* orange-400  */
            --accent-glow:    rgba(249, 115, 22, 0.25);

            /* Purple-tinted surfaces */
            --surface-color:  rgba(130, 80, 255, 0.05);
            --surface-border: rgba(130, 80, 255, 0.18);
            --purple-mid:     #7c3aed;   /* violet-700  */
        }
        
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: clip; /* clip instead of hidden — doesn't create a scroll container, so position:sticky works */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar — purple-tinted glass */
        .navbar { 
            border-bottom: 1px solid var(--surface-border) !important; 
            background: rgba(14, 10, 26, 0.85) !important; 
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            color: var(--text-light) !important;
        }
        .navbar a { color: var(--text-light) !important; }
        /* Keep the spinning star icon orange */
        .navbar svg path { fill: var(--accent-color) !important; }
        /* DaisyUI badge links */
        .navbar .badge {
            border-color: var(--surface-border) !important;
            color: var(--text-muted) !important;
        }
        .navbar .badge:hover {
            background: var(--accent-color) !important;
            border-color: var(--accent-color) !important;
            color: #fff !important;
        }
        /* Mobile burger button — ensure text is white */
        nav.navbar .btn,
        nav.navbar summary.btn {
            color: #ffffff !important;
        }
        
        footer { 
            border-top: 1px solid var(--surface-border) !important; 
            background: var(--bg-dark) !important;
            color: var(--text-muted) !important; 
        }
        footer svg path { fill: var(--text-muted) !important; transition: fill 0.3s; }
        footer a:hover svg path { fill: var(--accent-color) !important; }

        /* Hero Section */
        .portfolio-hero {
            padding: 120px 20px 80px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }
        .hero-title {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hero-subtitle {
            font-size: clamp(1.1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }
        
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Filter Bar ───────────────────────────────────────── */
        .filter-wrapper {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            padding: 0 16px;
            background: transparent;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }

        /* The pill shell */
        .filter-pill {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(14, 10, 26, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border);
            border-radius: 100px;
            padding: 6px 8px 6px 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(130,80,255,0.15);
        }

        /* Orange "Filter" label badge */
        .filter-label {
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            padding: 7px 16px;
            border-radius: 100px;
            flex-shrink: 0;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* ── Desktop: inline buttons (shown ≥ 640 px) ── */
        .filter-container {
            display: none;
            align-items: center;
            gap: 2px;
        }
        @media (min-width: 640px) {
            .filter-container { display: flex; }
            .filter-burger     { display: none !important; }
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .filter-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            color: var(--text-light);
        }
        .filter-btn.active {
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent-color);
            font-weight: 700;
        }

        /* ── Mobile: burger (hidden ≥ 640 px) ── */
        .filter-burger {
            display: flex;
            align-items: center;
        }

        .burger-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 7px 14px;
            border-radius: 100px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .burger-toggle:hover { color: var(--accent-color); }
        .burger-toggle svg { transition: transform 0.3s ease; flex-shrink: 0; }
        .burger-toggle.open svg:last-child { transform: rotate(180deg); }
        .burger-active-label { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Dropdown panel — opens upward */
        .filter-dropdown {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 10, 26, 0.96);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
            min-width: 200px;
            box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(24px);
            pointer-events: auto;
        }
        .filter-dropdown.open { display: flex; }
        .filter-dropdown .filter-btn {
            text-align: left;
            padding: 11px 16px;
            border-radius: 12px;
            width: 100%;
        }
        .filter-wrapper { position: relative; }

        /* Masonry Grid */
        .grid-container {
            column-count: 2;
            column-gap: 12px;
            padding: 0 12px 180px; /* extra bottom padding clears the fixed filter pill */
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        @media (min-width: 640px)  { .grid-container { column-gap: 20px; padding-left: 20px; padding-right: 20px; } }
        @media (min-width: 1024px) { .grid-container { column-count: 3; } }
        @media (min-width: 1536px) { .grid-container { column-count: 4; } }

        .project-card {
            break-inside: avoid;
            margin-bottom: 12px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--surface-border);
            transform: translateY(30px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        
        .project-card.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--accent-color);
            border-color: var(--accent-color);
            z-index: 10;
        }

        .project-card img, .project-card video {
            width: 100%;
            display: block;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--bg-card);
        }

        .project-card:hover img, .project-card:hover video {
            transform: scale(1.06);
        }

        /* Scroll To Top Button */
        .scroll-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(14, 10, 26, 0.9);
            border: 1px solid var(--surface-border);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .scroll-to-top:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(124, 58, 237, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(124, 58, 237, 0.7); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar p-7 sm:p-10 mx-auto" hx-get="../navbar.html" hx-trigger="load" hx-target="this"></nav>

    <!-- Hero Section -->
    <header class="portfolio-hero">
        <h1 class="hero-title">Selected Works</h1>
        <p class="hero-subtitle">A curated collection of my best work across graphic design, 3D art, branding, and front-end development.</p>
    </header>

    <!-- Filter Bar — floating pill fixed at bottom -->
    <div class="filter-wrapper">
        <div class="filter-pill">
            <!-- Orange "Filter" badge -->
            <span class="filter-label">Filter</span>

            <!-- Desktop: inline buttons -->
            <nav class="filter-container" id="filters" aria-label="Filter projects by category">
                <button class="filter-btn active" data-tag="all">All</button>
                <button class="filter-btn" data-tag="poster">Poster</button>
                <button class="filter-btn" data-tag="branding">Branding</button>
                <button class="filter-btn" data-tag="app">App</button>
                <button class="filter-btn" data-tag="website">Website</button>
                <button class="filter-btn" data-tag="3d">3D</button>
                <button class="filter-btn" data-tag="product">Product</button>
            </nav>

            <!-- Mobile: burger toggle -->
            <div class="filter-burger" id="filter-burger">
                <button class="burger-toggle" id="burger-toggle" aria-expanded="false" aria-controls="filter-dropdown">
                    <span class="burger-active-label" id="burger-label">All</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile dropdown (opens upward) -->
        <div class="filter-dropdown" id="filter-dropdown" role="menu">
            <button class="filter-btn active" data-tag="all">All</button>
            <button class="filter-btn" data-tag="poster">Poster</button>
            <button class="filter-btn" data-tag="branding">Branding</button>
            <button class="filter-btn" data-tag="app">App</button>
            <button class="filter-btn" data-tag="website">Website</button>
            <button class="filter-btn" data-tag="3d">3D</button>
            <button class="filter-btn" data-tag="product">Product</button>
        </div>
    </div>

    <!-- Masonry Grid -->
    <main class="grid-container" id="grid"></main>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" id="scroll-to-top" aria-label="Scroll back to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <!-- Footer -->
    <footer class="flex justify-between p-5 mt-auto" hx-get="../footer.html" hx-trigger="load" hx-target="this">
    </footer>

    <script>
        /* ── DOM refs ── */
        const grid               = document.getElementById("grid");

        /* Filter refs — both desktop pills (#filters) and mobile dropdown (#filter-dropdown) */
        const desktopFilters  = document.getElementById("filters");
        const dropdown        = document.getElementById("filter-dropdown");
        const burgerToggle    = document.getElementById("burger-toggle");
        const burgerLabel     = document.getElementById("burger-label");
        const allFilterBtns   = () => document.querySelectorAll(".filter-btn"); // live query

        let allProjects = [];
        let currentTag  = "all";

        /* ── Intersection Observers ── */
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px 50px 0px' });

        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                entry.isIntersecting
                    ? entry.target.play().catch(() => {})
                    : entry.target.pause();
            });
        }, { threshold: 0.2 });

        /* ── Burger menu ── */
        burgerToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle("open");
            burgerToggle.classList.toggle("open", isOpen);
            burgerToggle.setAttribute("aria-expanded", isOpen);
        });

        document.addEventListener("click", (e) => {
            if (!dropdown.contains(e.target) && e.target !== burgerToggle) {
                dropdown.classList.remove("open");
                burgerToggle.classList.remove("open");
                burgerToggle.setAttribute("aria-expanded", "false");
            }
        });

        /* ── Cards ── */
        function createProjectCard(p, index) {
            const card = document.createElement("div");
            card.className = "project-card";
            card.style.transitionDelay = `${(index % 8) * 0.05}s`;
            
            const isVideo = !!p.video;
            const mediaSrc = isVideo ? `../${p.video}` : `../${p.image}`;
            
            let mediaHTML = isVideo
                ? `<video muted loop playsinline preload="none"><source src="${mediaSrc}" type="video/mp4"></video>`
                : `<img src="${mediaSrc}" alt="${p.title || 'Project'}" loading="lazy">`;

            card.innerHTML = mediaHTML;
            return card;
        }

        function renderProjects(projects) {
            grid.innerHTML = "";
            projects.forEach((p, index) => {
                const card = createProjectCard(p, index);
                grid.appendChild(card);
                revealObserver.observe(card);
                if (p.video) {
                    const vid = card.querySelector("video");
                    if (vid) videoObserver.observe(vid);
                }
            });
        }

        /* ── Filter ── */
        function filterProjects(tag, labelText) {
            if (tag === currentTag) {
                // Close dropdown on re-tap same item
                dropdown.classList.remove("open");
                burgerToggle.classList.remove("open");
                return;
            }
            currentTag = tag;

            /* Sync all buttons in both pill row and dropdown */
            allFilterBtns().forEach(btn => {
                btn.classList.toggle("active", btn.dataset.tag === tag);
            });

            /* Update burger label */
            if (labelText) burgerLabel.textContent = labelText;

            /* Close dropdown */
            dropdown.classList.remove("open");
            burgerToggle.classList.remove("open");
            burgerToggle.setAttribute("aria-expanded", "false");

            /* Render */
            if (tag === "all") {
                renderProjects(allProjects);
            } else {
                renderProjects(allProjects.filter(p => p.tags && p.tags.includes(tag)));
            }
        }

        /* Wire ALL filter buttons (desktop + dropdown) via event delegation */
        document.querySelectorAll(".filter-wrapper").forEach(wrapper => {
            wrapper.addEventListener("click", (e) => {
                const btn = e.target.closest(".filter-btn");
                if (!btn) return;
                filterProjects(btn.dataset.tag, btn.textContent.trim());
            });
        });

        /* ── Scroll to top button ── */
        const scrollToTopBtn = document.getElementById("scroll-to-top");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 300) {
                scrollToTopBtn.classList.add("visible");
            } else {
                scrollToTopBtn.classList.remove("visible");
            }
        });
        scrollToTopBtn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        /* ── Init ── */
        async function init() {
            try {
                const res = await fetch("../projects.json");
                allProjects = await res.json();
                renderProjects(allProjects);
            } catch (err) {
                grid.innerHTML = `<p style="color:#f97316;text-align:center;padding:40px;">Failed to load projects.</p>`;
                console.error(err);
            }
        }

        init();
    </script>
    <script src="../src/magic-cursor.js"></script>
</body>

</html>
